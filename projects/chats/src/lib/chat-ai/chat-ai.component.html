<section *transloco="let t"
         class="ngu-chat-ai">
  <article class="ngu-chat-ai-header">
    <h4>{{ chatTitle() }}</h4>
  </article>
  @if (chatId()) {
    <article class="ngu-chat-ai-body" #body>
      @for (m of _messages(); track $index) {
        <ngu-chat-message-ai
          (whenLike)="chatStore.storeLike(chatId(), $event)"
          (whenDislike)="chatStore.storeDislike(chatId(), $event)"
          (whenAction)="chatStore.storeAction(chatId(), $event)"
          [message]="m">
          <ng-container like-icon *ngTemplateOutlet="likeTemplateRef"></ng-container>
          <ng-container dislike-icon *ngTemplateOutlet="dislikeTemplateRef"></ng-container>
          <ng-container action-icon *ngTemplateOutlet="actionTemplateRef"></ng-container>
        </ngu-chat-message-ai>
      }
    </article>
  } @else {
    <ngu-chat-empty></ngu-chat-empty>
  }
  @if (_likeId()) {
    <ngu-chat-like-feedback
      [message]="_messageLikeToSend() ?? ''"
      (whenSubmit)="submitMessageLike($event)"
      (whenClose)="chatStore.clearLike(chatId())">
      <ng-container send-icon *ngTemplateOutlet="sendTemplateRef"></ng-container>
      <ng-container close-icon *ngTemplateOutlet="closeTemplateRef"></ng-container>
    </ngu-chat-like-feedback>
  } @else if (_dislikeId()) {
    <ngu-chat-dislike-feedback
      [message]="_messageDislikeToSend() ?? ''"
      (whenSubmit)="submitMessageDislike($event)"
      (whenClose)="chatStore.clearDislike(chatId())">
      <ng-container send-icon *ngTemplateOutlet="sendTemplateRef"></ng-container>
      <ng-container close-icon *ngTemplateOutlet="closeTemplateRef"></ng-container>
    </ngu-chat-dislike-feedback>
  } @else {
    <ngu-chat-knowledge-base
      [knowledgeBases]="_knowledgeBase()"
      [selectedKnowledgeBase]="chatId() ? _selectedKnowledgeBase() : _temporaryKnowledgeBase()"
      [closeTemplateRef]="closeTemplateRef"
      (whenAddKnowledge)="knowledgeBaseAdd($event)"
      (whenRemoveKnowledge)="knowledgeBaseRemove($event)">
      <ng-container close-icon *ngTemplateOutlet="closeTemplateRef"></ng-container>
    </ngu-chat-knowledge-base>
    <ngu-chat-form
      [message]="chatId() ? _message() : _temporaryMessage()"
      [disabled]="chatId() ? (_isReceiving() || !_selectedKnowledgeBase().length) : (_isReceiving() || !_temporaryKnowledgeBase().length)"
      [isReceiving]="_isReceiving()"
      (whenSubmitted)="send($event)">
      <ng-container spin-icon *ngTemplateOutlet="spinTemplateRef"></ng-container>
      <ng-container send-icon *ngTemplateOutlet="sendTemplateRef"></ng-container>
    </ngu-chat-form>
  }
  <article class="ngu-chat-ai-footer">
    <p>{{ t('ngu.chat.ai.msg') }} {{ _message() | json }}</p>
  </article>
</section>
