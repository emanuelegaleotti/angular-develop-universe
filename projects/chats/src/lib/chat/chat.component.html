<section class="ngu-chat"
         *transloco="let t"
         [id]="id()">
  <article class="ngu-chat-header">
    <h4>{{chatTitle()}}</h4>
  </article>
  <article class="ngu-chat-messages" #body>
    @for ( m of messages(); track $index){
      @let bubble = toBubble(m);
      <ngu-chat-message
        [message]="bubble.text"
        [author]="bubble.author ?? 'other'"
        [time]="bubble.time"></ngu-chat-message>
    }
  </article>
  <ngu-chat-form
    [message]="chatStore.chats()[chatId()]?.message"
    (whenSubmitted)="chatStore.storeMessage(chatId(), $event)">
    <ng-container send-icon *ngTemplateOutlet="sendTemplateRef"></ng-container>
  </ngu-chat-form>
  <article class="ngu-chat-footer">
    <p>{{ t('ngu.chat.help') }}</p>
  </article>
</section>
