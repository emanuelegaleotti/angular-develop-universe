<form [formGroup]="feedbackForm"
      class="ngu-chat-dislike-feedback"
      *transloco="let t"
      (ngSubmit)="sendFeedback()">
  <div class='ngu-alert'>
    {{ t('ngu.chat-dislike-feedback.alert') }}
    <button type="button" (click)="whenClose.emit()">
      <ng-content select="[close-icon]"></ng-content>
    </button>
  </div>
  <div>
    <label [htmlFor]="'dislike-feedback'">{{ t('ngu.chat-dislike-feedback.label') }}</label>
    <textarea [id]="'dislike-feedback'"
              name="dislike-feedback"
              formControlName="feedback"
              aria-autocomplete="inline"
              aria-required="true"
              minlength="0"
              maxlength="256"
              [class.ngu-is-invalid]="feedback.invalid"
              [attr.aria-errormessage]="'dislike-feedback-error-feedback'"
    ></textarea>
    @if (feedbackForm.invalid && feedbackForm.dirty) {
      <div class="ngu-invalid-feedback"
           id='dislike-feedback-error-feedback'>
        {{ t('ngu.chat-dislike-feedback.' + Object.keys(feedbackForm.get('feedback')?.errors ?? {})[0])}}
      </div>
    }
  </div>
  <button type="submit"
          id="dislike-feedback-submit"
          [disabled]="feedbackForm.invalid || !feedbackForm.dirty"
          [title]="t('button.send')">
    <span>
      {{t('button.send')}}
    </span>
    <ng-content select="[send-icon]"></ng-content>
  </button>
</form>
