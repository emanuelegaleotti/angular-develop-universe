<fieldset class="ngu-select-object" *transloco="let t">
  <label [htmlFor]="id()"
         [id]="id()+'-label'">
    {{ _label() | transloco }}
    @if(control.errors && control.errors['required']){*}
  </label>
  <select [id]="id()"
          [name]="control.name"
          [attr.autocomplete]="autocomplete()"
          [autofocus]="autofocus()"
          (input)="setValue($event)"
          [class.ngu-is-valid]="(control.statusChanges | async) === 'VALID' && successMsg() && control.dirty"
          [class.ngu-is-invalid]="(control.statusChanges | async) === 'INVALID' && errorMsg() && control.dirty"
          [class.ngu-show-help]="helpMsg()"
          [attr.aria-describedby]="id()+'-help-feedback'"
          [attr.aria-disabled]="input.disabled"
          [attr.aria-invalid]="(control.statusChanges | async) === 'INVALID' && control.dirty"
          [attr.aria-errormessage]="id()+'-error-feedback'"
          aria-autocomplete="inline"
          #input
  >
    <option [value]="null"
            [ngValue]="null"
            [selected]="!control.value"
    ></option>
    @for (o of options(); track $index) {
      <option [value]="o[valueKey()]"
              [selected]="control.value === o[valueKey()]"
              [ngValue]="o[valueKey()]">
        {{ translateValue() ? t(o[optionKey()]) : o[optionKey()] }}
      </option>
    }
  </select>

  @if (successMsg()){
    <div class="ngu-valid-feedback">{{ _successMsg() | transloco }}</div>
  }

  @if (errorMsg()) {
    <div class="ngu-invalid-feedback" [id]="id+'-error-feedback'">
      @if (control.errors) {
        {{ feature() + '.' + control.name + '.' + Object.keys(control.errors)[0] | transloco }}
      }
    </div>
  }

  @if (helpMsg()) {
    <div class="ngu-help-feedback" [id]="id+'-help-feedback'">{{ _helpMsg() | transloco }}</div>
  }

</fieldset>
