openapi: 3.0.3
info:
  title: PokéAPI - Location
  version: 2.0.0
  description: PokéAPI endpoints for Location resource
servers:
  - url: https://pokeapi.co/api/v2
paths:
  /location:
    get:
      summary: List Locations
      operationId: listLocations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of Locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'
  /location/{name}:
    get:
      summary: Get Location by name or id
      operationId: getLocation
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Location details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
components:
  schemas:
    NamedApiResource:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
    LocationPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/NamedApiResource'
    GenerationGameIndex:
      type: object
      properties:
        game_index:
          type: integer
        generation:
          $ref: '#/components/schemas/NamedApiResource'
    Name:
      type: object
      properties:
        name:
          type: string
        language:
          $ref: '#/components/schemas/NamedApiResource'
    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        region:
          $ref: '#/components/schemas/NamedApiResource'
          nullable: true
        names:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/NamedApiResource'
        game_indices:
          type: array
          items:
            $ref: '#/components/schemas/GenerationGameIndex'
