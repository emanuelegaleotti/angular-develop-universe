openapi: 3.0.3
info:
  title: PokéAPI - Pokémon
  version: 2.0.0
  description: PokéAPI endpoints for Pokémon resource
servers:
  - url: https://pokeapi.co/api/v2
paths:
  /pokemon:
    get:
      summary: List Pokémon
      operationId: listPokemon
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of Pokémon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokemonPage'
  /pokemon/{name}:
    get:
      summary: Get Pokémon by name or id
      operationId: getPokemon
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pokémon details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pokemon'
components:
  schemas:
    NamedApiResource:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
    PokemonPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/NamedApiResource'
    PokemonAbility:
      type: object
      properties:
        ability:
          $ref: '#/components/schemas/NamedApiResource'
        is_hidden:
          type: boolean
        slot:
          type: integer
    PokemonType:
      type: object
      properties:
        slot:
          type: integer
        type:
          $ref: '#/components/schemas/NamedApiResource'
    PokemonStat:
      type: object
      properties:
        base_stat:
          type: integer
        effort:
          type: integer
        stat:
          $ref: '#/components/schemas/NamedApiResource'
    PokemonSprites:
      type: object
      properties:
        front_default:
          type: string
          nullable: true
        back_default:
          type: string
          nullable: true
        front_shiny:
          type: string
          nullable: true
    Pokemon:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        base_experience:
          type: integer
        height:
          type: integer
        weight:
          type: integer
        is_default:
          type: boolean
        abilities:
          type: array
          items:
            $ref: '#/components/schemas/PokemonAbility'
        types:
          type: array
          items:
            $ref: '#/components/schemas/PokemonType'
        stats:
          type: array
          items:
            $ref: '#/components/schemas/PokemonStat'
        sprites:
          $ref: '#/components/schemas/PokemonSprites'
