<section>
  <h2>Input email</h2>
  <p>Campo email con validazione del formato tramite <code>Validators.email</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-email
      formControlName="email"
      [id]="'email'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'email'"
      [maxLength]="30"
    ></ngu-input-email>
  </form>
  <article ksControlState [control]="form.controls.email"></article>
</section>
