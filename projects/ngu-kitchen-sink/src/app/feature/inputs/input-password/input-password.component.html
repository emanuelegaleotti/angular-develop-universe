<section>
  <h2>Input password</h2>
  <p>Campo password con pulsante per mostrare o nascondere il testo.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-password
      formControlName="password"
      [id]="'password'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'new-password'"
      [maxLength]="30"
    ></ngu-input-password>
  </form>
  <article ksControlState [control]="form.controls.password"></article>
</section>
