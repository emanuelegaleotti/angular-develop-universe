<section>
  <h2>Input time</h2>
  <p>Selettore di orario nativo del browser, con validazione di campo obbligatorio.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-time
      formControlName="time"
      [id]="'time'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'time'"
    ></ngu-input-time>
  </form>
  <article ksControlState [control]="form.controls.time"></article>
</section>
