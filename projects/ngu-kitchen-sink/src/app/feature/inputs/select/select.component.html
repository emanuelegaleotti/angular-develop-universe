<section>
  <h2>Select</h2>
  <p>Menu a tendina alimentato da un array di stringhe.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-select
      formControlName="select"
      [id]="'select'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'off'"
      [options]="options"
    ></ngu-select>
  </form>
  <article ksControlState [control]="form.controls.select"></article>
</section>
