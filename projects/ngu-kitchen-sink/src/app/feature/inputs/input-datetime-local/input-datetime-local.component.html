<section>
  <h2>Input datetime-local</h2>
  <p>Selettore di data e ora locali. Il valore è una stringa <code>yyyy-mm-ddThh:mm</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-datetime-local
      formControlName="datetime"
      [id]="'datetime'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'bday'"
    ></ngu-input-datetime-local>
  </form>
  <article ksControlState [control]="form.controls.datetime"></article>
</section>
