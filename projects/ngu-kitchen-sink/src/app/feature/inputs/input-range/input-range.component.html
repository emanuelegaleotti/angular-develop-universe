<section>
  <h2>Input range</h2>
  <p>Cursore per scegliere un valore numerico in un intervallo.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-range
      formControlName="range"
      [id]="'range'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'range'"
    ></ngu-input-range>
  </form>
  <article ksControlState [control]="form.controls.range"></article>
</section>
