<section>
  <h2>Textarea</h2>
  <p>Area di testo multilinea con limite di caratteri.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-textarea
      formControlName="textarea"
      [id]="'textarea'"
      [feature]="'input'"
      [maxLength]="256"
      [cols]="5"
      [rows]="5"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
    ></ngu-textarea>
  </form>
  <article ksControlState [control]="form.controls.textarea"></article>
</section>
