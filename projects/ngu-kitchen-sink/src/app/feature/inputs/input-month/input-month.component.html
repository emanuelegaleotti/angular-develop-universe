<section>
  <h2>Input month</h2>
  <p>Selettore di mese e anno. Il valore è una stringa <code>yyyy-mm</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-month
      formControlName="month"
      [id]="'month'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
    ></ngu-input-month>
  </form>
  <article ksControlState [control]="form.controls.month"></article>
</section>
