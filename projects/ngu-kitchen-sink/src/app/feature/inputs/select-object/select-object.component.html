<section>
  <h2>Select object</h2>
  <p>Menu a tendina alimentato da un array di oggetti: il testo mostrato viene da <code>optionKey</code>, il valore salvato da <code>valueKey</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-select-object
      formControlName="selectObject"
      [id]="'selectObject'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'off'"
      [options]="options"
      [optionKey]="'color'"
      [valueKey]="'id'"
    ></ngu-select-object>
  </form>
  <article ksControlState [control]="form.controls.selectObject"></article>
</section>
