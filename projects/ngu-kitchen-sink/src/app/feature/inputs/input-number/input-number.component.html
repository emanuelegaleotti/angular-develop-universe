<section>
  <h2>Input number</h2>
  <p>Campo numerico con validazione di minimo e massimo (da 0 a 15).</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-number
      formControlName="number"
      [id]="'number'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'age'"
      [max]="15"
    ></ngu-input-number>
  </form>
  <article ksControlState [control]="form.controls.number"></article>
</section>
