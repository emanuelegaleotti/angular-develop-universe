<section>
  <h2>Input color</h2>
  <p>Selettore di colore nativo. Il valore è una stringa esadecimale <code>#rrggbb</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-color
      formControlName="color"
      [id]="'color'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'color'"
    ></ngu-input-color>
  </form>
  <article ksControlState [control]="form.controls.color"></article>
</section>
