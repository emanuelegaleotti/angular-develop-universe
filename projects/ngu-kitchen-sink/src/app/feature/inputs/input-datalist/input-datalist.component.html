<section>
  <h2>Input datalist</h2>
  <p>Campo di testo con suggerimenti: l'utente può scegliere un valore dall'elenco o scrivere liberamente.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-datalist
      formControlName="datalist"
      [id]="'datalist'"
      [maxLength]="36"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'datalist'"
      [options]="options"
    ></ngu-input-datalist>
  </form>
  <article ksControlState [control]="form.controls.datalist"></article>
</section>
