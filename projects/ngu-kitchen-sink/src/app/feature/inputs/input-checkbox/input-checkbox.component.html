<section>
  <h2>Input checkbox</h2>
  <p>Casella booleana. Per obbligare l'utente a spuntarla si usa <code>Validators.requiredTrue</code>, perché <code>required</code> considera valido anche <code>false</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-checkbox
      formControlName="checkbox"
      [id]="'checkbox'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'off'"
    ></ngu-input-checkbox>
  </form>
  <article ksControlState [control]="form.controls.checkbox"></article>
</section>
