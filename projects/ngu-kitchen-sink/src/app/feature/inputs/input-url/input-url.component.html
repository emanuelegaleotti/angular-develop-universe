<section>
  <h2>Input url</h2>
  <p>Campo per indirizzi web, con validazione tramite <code>Validators.pattern</code> (deve iniziare con <code>http://</code>).</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-url
      formControlName="url"
      [id]="'url'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'url'"
    ></ngu-input-url>
  </form>
  <article ksControlState [control]="form.controls.url"></article>
</section>
