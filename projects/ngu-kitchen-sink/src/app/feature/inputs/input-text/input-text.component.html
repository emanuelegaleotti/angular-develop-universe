<section>
  <h2>Input text</h2>
  <p>Campo di testo libero con label, help, messaggio di successo ed errore generati dalle traduzioni.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-text
      formControlName="text"
      [id]="'text'"
      [maxLength]="36"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'username'"
    ></ngu-input-text>
  </form>
  <article ksControlState [control]="form.controls.text"></article>
</section>
