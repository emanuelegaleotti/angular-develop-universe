<section>
  <h2>Input date</h2>
  <p>Selettore di data nativo del browser. Il valore è una stringa ISO <code>yyyy-mm-dd</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-date
      formControlName="date"
      [id]="'date'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'bday'"
    ></ngu-input-date>
  </form>
  <article ksControlState [control]="form.controls.date"></article>
</section>
