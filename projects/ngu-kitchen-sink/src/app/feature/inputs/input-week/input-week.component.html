<section>
  <h2>Input week</h2>
  <p>Selettore di settimana dell'anno. Il valore è una stringa <code>yyyy-Www</code>.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-week
      formControlName="week"
      [id]="'week'"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
    ></ngu-input-week>
  </form>
  <article ksControlState [control]="form.controls.week"></article>
</section>
