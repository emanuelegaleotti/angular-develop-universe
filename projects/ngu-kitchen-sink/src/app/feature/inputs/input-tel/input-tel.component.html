<section>
  <h2>Input tel</h2>
  <p>Campo per numeri di telefono, con tastiera numerica sui dispositivi mobili.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    <ngu-input-tel
      formControlName="tel"
      [id]="'tel'"
      [maxLength]="36"
      [feature]="'input'"
      [helpMsg]="true"
      [successMsg]="true"
      [errorMsg]="true"
      [autocomplete]="'tel'"
    ></ngu-input-tel>
  </form>
  <article ksControlState [control]="form.controls.tel"></article>
</section>
