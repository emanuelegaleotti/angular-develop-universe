<section>
  <h2>Input radio</h2>
  <p>Gruppo di radio button collegati allo stesso <code>FormControl</code>: il valore è quello dell'opzione selezionata.</p>
  <form [formGroup]="form">
    <h3>Esempio</h3>
    @for (o of options; track o) {
      <ngu-input-radio
        formControlName="radio"
        [id]="'radio-' + o"
        [name]="'radio'"
        [radioLabel]="'input.radio.options.' + o"
        [radioValue]="o"
        [feature]="'input'"
        [helpMsg]="$last"
        [successMsg]="$last"
        [errorMsg]="$last"
        [autocomplete]="'off'"
      ></ngu-input-radio>
    }
  </form>
  <article ksControlState [control]="form.controls.radio"></article>
</section>
