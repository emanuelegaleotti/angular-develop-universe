<section>
  <h2>Line chart</h2>
  <p>Andamento nel tempo: la linea semplice, le serie multiple con curva morbida e la linea a gradini. Ogni grafico è disegnato sia con ECharts sia con Highcharts.</p>
  <article ksChartCompare heading="Vendite settimanali">
    <div echarts [options]="simpleChartOptions"></div>
    <div highchartsChart [options]="simpleHighchartsOptions"></div>
  </article>
  <article ksChartCompare heading="Serie multiple">
    <div echarts [options]="smoothChartOptions"></div>
    <div highchartsChart [options]="smoothHighchartsOptions"></div>
  </article>
  <article ksChartCompare heading="Linea a gradini">
    <div echarts [options]="steppedChartOptions"></div>
    <div highchartsChart [options]="steppedHighchartsOptions"></div>
  </article>
</section>
