<section>
  <h2>Pie chart</h2>
  <p>Proporzioni di un totale: torta classica, ciambella e grafico a rosa. Ogni grafico è disegnato sia con ECharts sia con Highcharts.</p>
  <article ksChartCompare heading="Torta">
    <div echarts [options]="pieOptions"></div>
    <div highchartsChart [options]="pieHighchartsOptions"></div>
  </article>
  <article ksChartCompare heading="Ciambella">
    <div echarts [options]="donutOptions"></div>
    <div highchartsChart [options]="donutHighchartsOptions"></div>
  </article>
  <article ksChartCompare heading="Rosa dei venti">
    <div echarts [options]="roseOptions"></div>
    <div highchartsChart [options]="roseHighchartsOptions"></div>
  </article>
</section>
