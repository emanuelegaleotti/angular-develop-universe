<section>
  <h2>Bar chart</h2>
  <p>Confronto tra categorie: barre singole, raggruppate e impilate (orizzontali). Ogni grafico è disegnato sia con ECharts sia con Highcharts.</p>
  <article ksChartCompare heading="Vendite settimanali">
    <div echarts [options]="simpleChartOptions"></div>
    <div highchartsChart [options]="simpleHighchartsOptions"></div>
  </article>
  <article ksChartCompare heading="Barre raggruppate">
    <div echarts [options]="groupedChartOptions"></div>
    <div highchartsChart [options]="groupedHighchartsOptions"></div>
  </article>
  <article ksChartCompare heading="Barre impilate">
    <div echarts [options]="stackedChartOptions"></div>
    <div highchartsChart [options]="stackedHighchartsOptions"></div>
  </article>
</section>
