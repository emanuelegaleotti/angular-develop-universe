<section>
  <h2>TanStack Query</h2>
  <article>
    @switch (query.status()) {
      @case ('pending') {
        <span>Loading...</span>
      }
      @case ('error') {
        <span>Error get data</span>
      }
      @default {
        <table>
          <thead>
          <tr>
            <th>ID</th>
            <th>Model</th>
            <th>Name</th>
            <th>Class</th>
          </tr>
          </thead>
          <tbody>
            @for (s of query.data()?.results; track s.id) {
              <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.model }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.starship_class }}</td>
              </tr>
            }
          </tbody>
        </table>
        <ngu-pager
          [totalItems]="query.data()?.count ?? 0"
          (whenPageSelected)="page.set($event)"
        ></ngu-pager>
      }
    }
  </article>
</section>
