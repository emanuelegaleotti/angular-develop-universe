<section>
  <h2>Carousel Component</h2>
  <ngu-carousel
    id="carousel"
    [scrollButtons]="true"
    [scrollMarker]="true"
    [container]="true"
    [inert]="true"
    [slidesPerViewInput]="4"
  >
    <ng-template #contentCarousel>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 1">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 2">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 3">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 4">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 5">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 6">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 7">
      </div>
      <div class="ngu-carousel-item">
        <img src="https://picsum.photos/500/500" alt="picture 8">
      </div>
      <div class="ngu-carousel-item">

</section>
