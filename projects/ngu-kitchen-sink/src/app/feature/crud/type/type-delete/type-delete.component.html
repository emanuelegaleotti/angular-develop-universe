<div class="ks-confirm" id="type-delete">
  <div class="ks-confirm-body">
    <span class="ks-confirm-icon" aria-hidden="true">
      <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
      </svg>
    </span>
    <div>
      <h4>Elimina tipo</h4>
      <p>Sei sicuro di voler eliminare <strong>{{ name }}</strong>?</p>
      <p>Questa operazione non può essere annullata.</p>
    </div>
  </div>
  <div class="ks-confirm-footer">
    <button class="ngu-button ngu-secondary" type="button" (click)="onCancel()">Annulla</button>
    <button class="ngu-button ngu-error" type="button" (click)="onDelete()">Elimina</button>
  </div>
</div>
