<section id="species-edit">
  <h2>{{ title() }}</h2>
  <p>
    {{ isCreateMode() ? 'Creazione' : 'Modifica' }} di una specie tramite <strong>reactive form</strong>.
    La chiamata al servizio è uno stub: i dati non vengono salvati.
  </p>

  <form class="ks-crud-form" [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <h3>Dati della specie</h3>
    <div class="ks-crud-fields">
      <ngu-input-text formControlName="name" [id]="'name'" [feature]="'crud'" [errorMsg]="true" />
      <ngu-input-number formControlName="capture_rate" [id]="'capture_rate'" [feature]="'crud'" [errorMsg]="true" />
      <ngu-input-number formControlName="base_happiness" [id]="'base_happiness'" [feature]="'crud'" [errorMsg]="true" />
      <ngu-input-number formControlName="gender_rate" [id]="'gender_rate'" [feature]="'crud'" [errorMsg]="true" />
    </div>
    <div class="ks-crud-form-actions">
      <button class="ngu-button ngu-secondary" type="button" [routerLink]="['/crud/pokemon-species']">Annulla</button>
      <button class="ngu-button ngu-primary" type="submit" [disabled]="editForm.invalid">
        {{ isCreateMode() ? 'Crea' : 'Salva' }}
      </button>
    </div>
  </form>
</section>
