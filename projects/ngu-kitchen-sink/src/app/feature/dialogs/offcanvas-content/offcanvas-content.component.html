<div class="ngu-offcanvas-body" id="offcanvas-demo">
  <p>Pannello laterale per contenuti secondari: dettagli, filtri o moduli brevi, senza lasciare la pagina.</p>
  <dl>
    <div>
      <dt>Dati ricevuti</dt>
      <dd>{{ offcanvasData()?.['test'] }}</dd>
    </div>
    <div>
      <dt>Chiusura</dt>
      <dd>Pulsante in alto, tasto Esc o click sullo sfondo</dd>
    </div>
  </dl>
</div>
<div class="ngu-offcanvas-footer">
  <button class="ngu-button ngu-secondary" type="button" (click)="onClose()">Annulla</button>
  <button class="ngu-button ngu-primary" type="button" (click)="onClose()">Conferma</button>
</div>
