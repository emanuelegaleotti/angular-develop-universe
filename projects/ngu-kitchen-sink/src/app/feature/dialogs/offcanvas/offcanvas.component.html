<section>
  <h2>Offcanvas</h2>
  <p>Pannello laterale ancorato a sinistra o a destra, con header, corpo e footer di azioni.</p>
  <article>
    <h3>Posizione</h3>
    <div class="ks-actions">
      <button class="ngu-button ngu-primary"
              (click)="openOffcanvasLeft()"
              type="button"
              title="primary">
        Apri a sinistra
      </button>
      <button class="ngu-button ngu-primary"
              (click)="openOffcanvasRight()"
              type="button"
              title="primary">
        Apri a destra
      </button>
    </div>
  </article>
</section>
